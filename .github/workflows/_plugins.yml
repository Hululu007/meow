# 可复用工作流：构建插件 zip（apiserver / drpy / danmu-api / ffmpeg）。
#
# 被 release.yml 调用（workflow_call），也可手动 dispatch 单验。
#
# ## 为什么和 PC 壳拆开（2026-11）
#
# 原来插件和 PC 壳挤在一个 job 里，插件的频率远低于壳，混在一起意味着
# "只发插件"也要赔上一次 Rust 编译。拆开后两者可独立 dispatch。
#
# ## 为什么仍在 Windows（实测结论）
#
# 本想把插件搬到 Linux 省掉 2 倍计费，实测**跑不通**：`build-plugins.ps1`
# 写死调 `powershell`（Linux 只有 pwsh，已改成按平台选），但下游
# `build-plugin.ps1` 内部还直接调 `cmd`，逐个移植成本远大于收益。
# 结论：插件留在 Windows；要省额度只能整脚本跨平台化，另开任务。
#
# ## 内容没变就跳过
#
# key 由真正影响产物的输入算出来：units.json（插件清单唯一真源）+ 各构建脚本 +
# server 源码。命中就直接用缓存里的 plugins-out 上传，不跑任何构建。
# 实测收益：apiserver 的 jlink 约 2–3 分钟。

name: _plugins

on:
  workflow_dispatch:
    inputs:
      plugins_only:
        description: '只构建这些插件（逗号分隔，如 apiserver；留空=全部）'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      plugins_only:
        description: 只构建这些插件（逗号分隔，空=全部）
        required: false
        type: string
        default: ''
    outputs:
      artifact:
        description: 产出的 artifact 名
        value: plugins

jobs:
  plugins:
    name: 插件（Windows）
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # apiserver 插件要 javac + jlink
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # danmu 插件要在克隆下来的上游里跑 npm install
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ★ key 里必须带 plugins_only（2026-11-13 修）：这条路以前被 pc-v*/tv-v*
      #   用 `apiserver` 跑过，产物只有 apiserver 一个，却和全量共用同一个 key ——
      #   下一次全量命中就会"跳过构建"，Release 里少好几个插件。
      # ★ 用 restore/save 拆分而不是 actions/cache：
      #   actions/cache 在 job 结束就存，2026-11-13 踩过 —— 某次插件因网络抖动
      #   失败（units.json 里它是可选单元，job 仍绿），半套产物被存进
      #   `plugins-Windows-all-…`，下一次全量直接命中并「跳过构建」，
      #   Release 里永久缺件。现在只有校验通过才 save。
      # cache key 不允许逗号（GitHub 校验：cannot contain commas），而 plugins_only
      # 是多值逗号分隔 → 先换成横杠再进 key。
      # ★ 不能用 `replace()`：GitHub Actions 表达式没有这个函数（用了会让整个
      #   workflow 解析失败 —— 表现为 Actions 列表里名字变成文件路径、tag 事件不触发，
      #   2026-11-26 实测）。
      - name: 生成缓存键标识（plugins_only 去逗号）
        id: slug
        shell: bash
        run: |
          V='${{ inputs.plugins_only }}'
          [ -z "$V" ] && V=all
          echo "v=${V//,/-}" >> "$GITHUB_OUTPUT"

      - name: 恢复插件产物缓存
        id: pcache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/plugins-out
          # ★ 必须带上 client/package.json：apiserver 的版本已改为运行时读 VERSION 文件，
          #   `server/host/src/**` 的 hash 不再随版本变；缓存单位是"打好包的 zip"（内含
          #   VERSION/manifest），键里不含版本就会在下一版复用旧 zip → 发出旧版本号。
          # ★ guard-libs / tools/guard（2026-11-25 补）：apiserver 插件会按平台裁剪
          #   guard-libs（正则清单在 trim 脚本里、helper 源码在 tools/guard），漏进键里
          #   会出现"改了裁剪清单却复用旧 zip"——和上面 manifests 那次同款事故。
          # ★ pyrt（2026-11-26 补）：产物是「pyrt.py + vendor/ 里 pip 装好的依赖」，
          #   这两个输入都不在旧键里 → 改了 pyrt.py / requirements.txt 会复用旧 zip。
          key: plugins-${{ runner.os }}-${{ steps.slug.outputs.v }}-${{ hashFiles('client/package.json', 'deploy/units.json', 'server/build-plugin.ps1', 'server/build-plugin-danmu.ps1', 'server/build-plugin-drpy.ps1', 'server/build-plugin-ffmpeg.ps1', 'server/build-plugin-pyrt.ps1', 'server/pyrt/**', 'server/plugin-manifests/**', 'server/host/src/**', 'server/host/guard-libs/**', 'server/tools/guard/**', 'server/drpy/**') }}

      # ── 静态载荷缓存（2026-11-13 新增）────────────────────────────────
      # 有两类"与代码无关、却每版都重新下载/重建"的东西，实测占本 job 一半：
      #   · ffmpeg 包（110MB）与 danmu 上游（--depth 1 main）：下载 URL 是**滚动**
      #     地址，所以按 ISO 周刷新，避免悄悄钉死在上个月的二进制/源码。
      # ★ tv-node 已经移出本 job（归 tv-plugins-v* 链），这里不再缓存它的 .deps。
      - name: 计算载荷缓存键
        id: ck
        if: ${{ steps.pcache.outputs.cache-hit != 'true' && inputs.plugins_only == '' }}
        shell: bash
        run: |
          set -euo pipefail
          # git ls-files 只列入库文件：.deps / release / .tmp 这些产物目录不会污染 key
          TV=$(git ls-files -z deploy/units.json client/apps/tv/runtime-node \
               | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "tv=$TV" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: 缓存 ffmpeg 包与 danmu 上游（周更）
        if: ${{ steps.pcache.outputs.cache-hit != 'true' && inputs.plugins_only == '' }}
        uses: actions/cache@v4
        with:
          path: |
            build/.tmp/ffmpeg-dl
            research/upstream/danmu_api
          key: plugins-ext-${{ runner.os }}-${{ steps.ck.outputs.week }}

      # danmu 插件需要上游源码（不入库）：浅克隆一次，拿不到就跳过该插件
      - name: 准备 danmu 上游源码
        if: ${{ steps.pcache.outputs.cache-hit != 'true' && (inputs.plugins_only == '' || contains(inputs.plugins_only, 'danmu')) }}
        shell: pwsh
        continue-on-error: true
        run: |
          $dst = 'research/upstream/danmu_api'
          if (Test-Path $dst) { Write-Host '已存在'; exit 0 }
          New-Item -ItemType Directory -Path (Split-Path $dst) -Force | Out-Null
          git clone --depth 1 https://github.com/huangxd-/danmu_api.git $dst
          Push-Location $dst
          npm install --omit=dev --no-audit --no-fund
          Pop-Location

      # dex2jar：apiserver 插件每次要下 ~20MB 再裁剪，实测 30.6s，占本 job 约三分之一。
      # `build-plugin.ps1` 自带复用分支（`server/tools/dex2jar/lib` 存在就不下载），
      # 所以这里只要缓存目录，脚本一行不用改。
      # ★ key 只吃 fetch 脚本指纹：dex2jar 版本与裁剪白名单都在那个脚本里，与代码版本无关。
      # ★ 不复用 fpk 的 `jar-d2j-*` 键：那个键里还含 apiserver.jar，恢复进来会往插件
      #   输出目录塞一个旧 jar（正常路径会被覆盖，失败路径会残留）。
      # ★ restore/save 拆分（同下面产物缓存的理由）：构建失败不留半套缓存。
      - name: 恢复 dex2jar
        id: d2j
        if: ${{ steps.pcache.outputs.cache-hit != 'true' && (inputs.plugins_only == '' || contains(inputs.plugins_only, 'apiserver')) }}
        uses: actions/cache/restore@v4
        with:
          path: server/tools/dex2jar
          key: dex2jar-${{ runner.os }}-${{ hashFiles('deploy/scripts/fetch-dex2jar.ps1') }}

      # ★ pyrt 现在**自带解释器**：构建脚本下载官方 embeddable 3.12 打进插件包
      #   （exec 指向 python/python.exe），用户机器不需要预装 Python —— 对齐
      #   node 插件自带 node.exe 的做法。
      #   这次 setup-python 只为跑 pip：脚本用 --python-version 3.12 跨版本挑
      #   cp312 的 wheel，宿主版本其实无关。留着它是为了消掉不确定性 ——
      #   runner 预装的 `python` 会随镜像轮换（3.9 / 3.12 都出现过），
      #   也出现过 Microsoft Store 别名（调用即失败、报错指向商店）。
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 插件列表读 deploy/units.json（唯一真源），不在这里写死脚本名。
      - name: 构建插件
        id: build
        if: ${{ steps.pcache.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          $outPlugins = Join-Path '${{ runner.temp }}' 'plugins-out'
          $only = '${{ inputs.plugins_only }}'
          if ($only) {
            Write-Host "只构建：$only（跳过其余插件，省 ffmpeg 110MB 下载 / danmu 上游 clone）"
            ./deploy/scripts/build-plugins.ps1 -OutDir $outPlugins -Only ($only -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          } else {
            # ★ 只建 plugins 链（apiserver/drpy/danmu/ffmpeg）。tv-node 的版本线是
            #   18.20.4.<N>，跟壳版本无关 —— 它归 tv-plugins-v* 链，混进来就是
            #   每版白建 124s / 155MB，产物还不发出去（2026-11-13 实测）。
            ./deploy/scripts/build-plugins.ps1 -OutDir $outPlugins -Chain plugins
          }
          if ($LASTEXITCODE -ne 0) { throw '插件构建失败（见上方 units.json 清单）' }

      - name: 命中缓存（跳过构建）
        if: ${{ steps.pcache.outputs.cache-hit == 'true' }}
        shell: bash
        run: |
          echo "插件输入未变，复用缓存产物"
          ls -la "${{ runner.temp }}/plugins-out" || true

      # dex2jar 只在"这次真下载且构建走完"时写缓存；下载失败会让 build 步骤抛错，自然不写。
      - name: 保存 dex2jar（构建成功才写）
        if: ${{ steps.d2j.outputs.cache-hit != 'true' && steps.build.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: server/tools/dex2jar
          key: ${{ steps.d2j.outputs.cache-primary-key }}

      # 产物齐全才允许写缓存（原因见上面「恢复插件产物缓存」的注释）。
      # 不全时只警告、不红：可选单元（danmu/ffmpeg）失败不该阻断发版
      # （清单会沿用上一版条目），但**绝不能把半套产物缓存成"已构建"**。
      - name: 校验产物齐全
        id: verify
        if: ${{ steps.pcache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          # ★ Windows runner 的 $RUNNER_TEMP 是 D:\a\_temp 这种带反斜杠的路径，
          #   bash 直接拼会落空（glob 全不匹配 → 静默 ok=0、缓存永远不保存）。
          #   先统一成 /，再断言目录存在：配置错要红，不能伪装成"产物不全"。
          OUT="$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || echo "$RUNNER_TEMP")/plugins-out"
          [ -d "$OUT" ] || { echo "::error::产物目录不存在：$OUT"; exit 1; }
          ONLY='${{ inputs.plugins_only }}'
          ok=1
          if [ -z "$ONLY" ]; then
            for pat in 'apiserver-*.zip' 'drpy-*.zip' 'ffmpeg-*.zip' 'node-*.zip'; do
              if ! compgen -G "$OUT/$pat" >/dev/null 2>&1; then
                echo "::warning::产物不全：缺 $pat"; ok=0
              fi
            done
          else
            if [ -z "$(ls -A "$OUT" 2>/dev/null)" ]; then
              echo "::warning::产物为空（plugins_only=$ONLY）"; ok=0
            fi
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          ls -la "$OUT" | head -20

      - name: 保存插件产物缓存（产物齐全才存）
        if: ${{ steps.pcache.outputs.cache-hit != 'true' && steps.verify.outputs.ok == '1' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/plugins-out
          key: ${{ steps.pcache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: ${{ runner.temp }}/plugins-out/**
          if-no-files-found: error

      # 预编译 class 给 Docker 用（见 _docker.yml）：.class 与 CPU 架构无关，
      # 复用它可以省掉 apiserver 镜像里 arm64 的 javac（QEMU 下实测 162.7s）。
      # build-plugin.ps1 的中间产物就在这个目录；只在真的编过（缓存未命中）时存在，
      # 没有就 warn —— Docker 那边有"为空则就地编译"的回退。
      - name: 上传预编译 classes（Docker 镜像复用）
        if: ${{ steps.pcache.outputs.cache-hit != 'true' && (inputs.plugins_only == '' || contains(inputs.plugins_only, 'apiserver')) }}
        uses: actions/upload-artifact@v4
        with:
          name: apiserver-classes
          path: server/build/.tmp/plugin-build/classes/**
          if-no-files-found: warn
          retention-days: 3
