# 可复用工作流：构建插件 zip（apiserver / drpy / danmu-api / ffmpeg）。
#
# 被 release.yml 调用（workflow_call），也可手动 dispatch 单验。
#
# ## 为什么和 PC 壳拆开（2026-11）
#
# 原来插件和 PC 壳挤在一个 job 里，插件的频率远低于壳，混在一起意味着
# "只发插件"也要赔上一次 Rust 编译。拆开后两者可独立 dispatch。
#
# ## 为什么仍在 Windows（实测结论）
#
# 本想把插件搬到 Linux 省掉 2 倍计费，实测**跑不通**：`build-plugins.ps1`
# 写死调 `powershell`（Linux 只有 pwsh，已改成按平台选），但下游
# `build-plugin.ps1` 内部还直接调 `cmd`，逐个移植成本远大于收益。
# 结论：插件留在 Windows；要省额度只能整脚本跨平台化，另开任务。
#
# ## 内容没变就跳过
#
# key 由真正影响产物的输入算出来：units.json（插件清单唯一真源）+ 各构建脚本 +
# server 源码。命中就直接用缓存里的 plugins-out 上传，不跑任何构建。
# 实测收益：apiserver 的 jlink 约 2–3 分钟。

name: _plugins

on:
  workflow_dispatch:
    inputs:
      plugins_only:
        description: '只构建这些插件（逗号分隔，如 apiserver；留空=全部）'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      plugins_only:
        description: 只构建这些插件（逗号分隔，空=全部）
        required: false
        type: string
        default: ''
    outputs:
      artifact:
        description: 产出的 artifact 名
        value: plugins

jobs:
  plugins:
    name: 插件（Windows）
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # apiserver 插件要 javac + jlink
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # danmu 插件要在克隆下来的上游里跑 npm install
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ★ key 里必须带 plugins_only（2026-11-13 修）：这条路以前被 pc-v*/tv-v*
      #   用 `apiserver` 跑过，产物只有 apiserver 一个，却和全量共用同一个 key ——
      #   下一次全量命中就会"跳过构建"，Release 里少 drpy/danmu/ffmpeg/tv-node。
      # ★ 用 restore/save 拆分而不是 actions/cache：
      #   actions/cache 在 job 结束就存，2026-11-13 踩过 —— tv-node 的 gradle 因
      #   Maven 镜像抖动失败（units.json 里它是可选单元，job 仍绿），半套产物
      #   被存进 `plugins-Windows-all-…`，下一次全量直接命中并「跳过构建」，
      #   Release 里永远少 3 个 tv-node APK。现在只有校验通过才 save。
      - name: 恢复插件产物缓存
        id: pcache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/plugins-out
          key: plugins-${{ runner.os }}-${{ inputs.plugins_only || 'all' }}-${{ hashFiles('deploy/units.json', 'server/build-plugin.ps1', 'server/build-plugin-danmu.ps1', 'server/build-plugin-drpy.ps1', 'server/build-plugin-ffmpeg.ps1', 'server/host/src/**', 'server/drpy/**') }}

      # ── 静态载荷缓存（2026-11-13 新增）────────────────────────────────
      # 有两类"与代码无关、却每版都重新下载/重建"的东西，实测占本 job 一半：
      #   · tv-node：.deps 里的 nodejs-mobile zip（三个 ABI 解压）+ release/ 下的
      #     3 个 APK。脚本本身有 reuse 分支（inputs 未变就不跑 gradle），但复用
      #     目录在 CI 上是干净的 → 每版重建（1.2.4 实测 124s）。
      #   · ffmpeg 包（110MB）与 danmu 上游（--depth 1 main）：下载 URL 是**滚动**
      #     地址，所以这两个按 ISO 周刷新，避免悄悄钉死在上个月的二进制/源码。
      # ★ key 不吃 app 版本：tv-node 只跟入库文件（含脚本里的 NodeVersion）走。
      - name: 计算载荷缓存键
        id: ck
        if: ${{ steps.pcache.outputs.cache-hit != 'true' && inputs.plugins_only == '' }}
        shell: bash
        run: |
          set -euo pipefail
          # git ls-files 只列入库文件：.deps / release / .tmp 这些产物目录不会污染 key
          TV=$(git ls-files -z deploy/units.json client/apps/tv/runtime-node \
               | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "tv=$TV" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: 缓存 tv-node 载荷与产物（命中即走脚本自己的 reuse）
        if: ${{ steps.pcache.outputs.cache-hit != 'true' && inputs.plugins_only == '' }}
        uses: actions/cache@v4
        with:
          path: |
            client/apps/tv/runtime-node/.deps
            release/runtime-node-*
          key: plugins-tvnode-${{ runner.os }}-${{ steps.ck.outputs.tv }}

      - name: 缓存 ffmpeg 包与 danmu 上游（周更）
        if: ${{ steps.pcache.outputs.cache-hit != 'true' && inputs.plugins_only == '' }}
        uses: actions/cache@v4
        with:
          path: |
            build/.tmp/ffmpeg-dl
            research/upstream/danmu_api
          key: plugins-ext-${{ runner.os }}-${{ steps.ck.outputs.week }}

      # danmu 插件需要上游源码（不入库）：浅克隆一次，拿不到就跳过该插件
      - name: 准备 danmu 上游源码
        if: ${{ steps.pcache.outputs.cache-hit != 'true' && (inputs.plugins_only == '' || contains(inputs.plugins_only, 'danmu')) }}
        shell: pwsh
        continue-on-error: true
        run: |
          $dst = 'research/upstream/danmu_api'
          if (Test-Path $dst) { Write-Host '已存在'; exit 0 }
          New-Item -ItemType Directory -Path (Split-Path $dst) -Force | Out-Null
          git clone --depth 1 https://github.com/huangxd-/danmu_api.git $dst
          Push-Location $dst
          npm install --omit=dev --no-audit --no-fund
          Pop-Location

      # 插件列表读 deploy/units.json（唯一真源），不在这里写死脚本名。
      - name: 构建插件
        if: ${{ steps.pcache.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          $outPlugins = Join-Path '${{ runner.temp }}' 'plugins-out'
          $only = '${{ inputs.plugins_only }}'
          if ($only) {
            Write-Host "只构建：$only（跳过其余插件，省 ffmpeg 110MB 下载 / danmu 上游 clone）"
            ./deploy/scripts/build-plugins.ps1 -OutDir $outPlugins -Only ($only -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          } else {
            ./deploy/scripts/build-plugins.ps1 -OutDir $outPlugins
          }
          if ($LASTEXITCODE -ne 0) { throw '插件构建失败（见上方 units.json 清单）' }

      - name: 命中缓存（跳过构建）
        if: ${{ steps.pcache.outputs.cache-hit == 'true' }}
        shell: bash
        run: |
          echo "插件输入未变，复用缓存产物"
          ls -la "${{ runner.temp }}/plugins-out" || true

      # ★ tv-node unit 把 APK 写到 release/runtime-node-<ver>/（脚本默认 OutDir），
      #   不会被 index 脚本收进 plugins-out —— 于是 release-v* 一直靠 sync-packages
      #   从上一版 Release「继承」那三个 APK，本次白编 155MB（2026-11-13 实测）。
      #   这里把它们收拢进 plugins-out，让全量 Release 自包含、sha 与本次构建一致。
      - name: 收拢 tv-node APK 到产物目录
        if: ${{ steps.pcache.outputs.cache-hit != 'true' && inputs.plugins_only == '' }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/plugins-out"
          shopt -s nullglob
          n=0
          for f in release/runtime-node-*/tv-node-*.apk; do
            cp -f "$f" "$OUT/"; n=$((n+1))
          done
          echo "收拢 $n 个 tv-node APK 到 $OUT"

      # 产物齐全才允许写缓存（原因见上面「恢复插件产物缓存」的注释）。
      # 不全时只警告、不红：tv-node 在 units.json 里是可选的，缺它 Release 仍可用
      # （清单会沿用上一版的模块条目），但**绝不能把半套产物缓存成"已构建"**。
      - name: 校验产物齐全
        id: verify
        if: ${{ steps.pcache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          # 不能用 ${{ runner.temp }}：它在 Windows 上是 D:/a/_temp 这种带反斜杠的路径，
          # 在 bash 里反斜杠会被吃掉，glob 全落空 → 误报"产物不全"并整步失败（踩过）。
          OUT="$RUNNER_TEMP/plugins-out"
          ONLY='${{ inputs.plugins_only }}'
          ok=1
          if [ -z "$ONLY" ]; then
            for pat in 'apiserver-*.zip' 'drpy-*.zip' 'ffmpeg-*.zip' 'node-*.zip'; do
              if ! compgen -G "$OUT/$pat" >/dev/null 2>&1; then
                echo "::warning::产物不全：缺 $pat"; ok=0
              fi
            done
            n=$(compgen -G "$OUT/tv-node-*.apk" 2>/dev/null | wc -l | tr -d ' ' || true)
            if [ "$n" -lt 3 ]; then
              echo "::warning::产物不全：tv-node APK 只有 $n/3（gradle 或 Maven 镜像大概率有问题，下轮会重建）"
              ok=0
            fi
          else
            if [ -z "$(ls -A "$OUT" 2>/dev/null)" ]; then
              echo "::warning::产物为空（plugins_only=$ONLY）"; ok=0
            fi
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          ls -la "$OUT" | head -20

      - name: 保存插件产物缓存（产物齐全才存）
        if: ${{ steps.pcache.outputs.cache-hit != 'true' && steps.verify.outputs.ok == '1' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/plugins-out
          key: ${{ steps.pcache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: ${{ runner.temp }}/plugins-out/**
          if-no-files-found: error
