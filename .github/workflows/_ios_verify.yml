name: _ios_verify

# Runner 侧端到端验证（**IPA 内的同一份 host.jar**，端内 dex2jar 模式）：
#   1) 豆瓣 native 源：/api/Douban/category，截图
#   2) 导入 http://肥猫.net/tv：配置解码、dex→class、站点表
#   3) jar 爬虫：搜索 → 详情 → 播放 URL
# host.jar 由 client/apps/ios/scripts/build-host.sh 产出，与 IPA 打包用的完全一致；
# 运行时加 -Dmeow.dex2jar.inprocess=true，所以这里不需要外部 dex2jar/exec。
# 注意：这是 macOS JDK 上的宿主验证；IPA 内嵌 JDK9 静态库的真机启动仍需 iPhone。
on:
  push:
    branches: [feat/ios-jvm]
  workflow_dispatch:

concurrency:
  group: ios-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Cache web dist
        id: webdist
        uses: actions/cache@v4
        with:
          path: client/apps/web/dist
          key: ios-webdist-${{ hashFiles('client/apps/web/src/**', 'client/apps/web/package.json', 'client/apps/web/vite.config.ts', 'client/apps/web/index.html', 'client/pnpm-lock.yaml', 'client/package.json') }}

      - name: Build web dist
        if: steps.webdist.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd client
          pnpm install --frozen-lockfile
          pnpm build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build iOS host (in-process dex2jar)
        run: |
          set -euo pipefail
          bash client/apps/ios/scripts/build-host.sh
          ls -lh client/apps/ios/build/jvm/host.jar client/apps/ios/build/jvm/libs | head

      - name: Start mock + host + web
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/meow-data" artifacts
          cp client/apps/ios/scripts/ci-verify-config.json "$RUNNER_TEMP/meow-data/config.sites.json"
          nohup python3 client/apps/ios/scripts/mock_cms.py --port 8099 \
            > "$RUNNER_TEMP/mock.log" 2>&1 &
          MEOW_BIND=127.0.0.1 \
            nohup java -Dfile.encoding=UTF-8 -Dmeow.dex2jar.inprocess=true \
              -XX:+UnlockDiagnosticVMOptions -XX:-BytecodeVerificationRemote \
              -cp "client/apps/ios/build/jvm/host.jar:client/apps/ios/build/jvm/libs/*" \
              ApiServer --port=9978 --data-dir="$RUNNER_TEMP/meow-data" \
              > "$RUNNER_TEMP/host.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/host.pid"
          nohup python3 client/apps/ios/scripts/serve_web.py \
            --root client/apps/web/dist --port 9979 \
            --api-base http://127.0.0.1:9978 --site Douban \
            > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9978/api/health > "$RUNNER_TEMP/health.json" 2>/dev/null && break
            sleep 1
          done
          cat "$RUNNER_TEMP/health.json" | head -c 300

      - name: Douban API + screenshot
        run: |
          set -euo pipefail
          curl -s --max-time 90 -X POST -H 'Content-Type: application/json' \
            -d '{"id":"tv_hot","page":"1"}' \
            http://127.0.0.1:9978/api/Douban/category \
            -o artifacts/douban-category.json -w "douban-category %{http_code} %{size_download} %{time_total}\n"
          python3 - <<'PY'
          import json
          d = json.load(open('artifacts/douban-category.json', encoding='utf-8'))
          items = d.get('list') or []
          print('DOUBAN_ITEMS', len(items))
          print('DOUBAN_FIRST', (items[0].get('vod_name') if items else None))
          assert items, 'Douban category returned no items'
          PY
          CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          test -x "$CHROME"
          "$CHROME" --headless=new --disable-gpu --hide-scrollbars --mute-audio \
            --no-first-run --no-default-browser-check --force-device-scale-factor=2 \
            --user-data-dir="$RUNNER_TEMP/chrome-douban" --window-size=430,932 \
            --virtual-time-budget=25000 \
            --screenshot="$PWD/artifacts/douban-home.png" \
            "http://127.0.0.1:9979/" || true

      - name: Import 肥猫 + sites
        run: |
          set -euo pipefail
          curl -s --max-time 180 -X POST -H 'Content-Type: application/json' \
            -d '{"url":"http://肥猫.net/tv","mode":"replace","onConflict":"keep","dryRun":false,"replaceSpider":true}' \
            http://127.0.0.1:9978/api/config/import \
            -o artifacts/feimao-import.json -w "feimao-import %{http_code} %{size_download} %{time_total}\n"
          head -c 1200 artifacts/feimao-import.json; echo
          curl -s --max-time 30 http://127.0.0.1:9978/api/sites -o artifacts/feimao-sites.json
          python3 - <<'PY'
          import json
          imp = json.load(open('artifacts/feimao-import.json', encoding='utf-8'))
          d2j = imp.get('dex2jvm') or {}
          print('DEX2JVM', json.dumps(d2j, ensure_ascii=False))
          assert d2j.get('enabled'), 'dex2jvm not enabled (in-process flag missing?)'
          assert d2j.get('converted', 0) >= 1, 'dex2jvm converted nothing'
          assert d2j.get('failed', 0) == 0, 'dex2jvm failed'
          d = json.load(open('artifacts/feimao-sites.json', encoding='utf-8'))
          sites = d.get('sites') or []
          print('FEIMAO_SITES', len(sites))
          assert len(sites) >= 30, 'too few sites imported'
          keys = [s.get('key') for s in sites]
          print('KEYS', keys[:20])
          open('artifacts/feimao-keys.txt','w').write('\n'.join(keys))
          PY

      - name: Search / detail / play
        run: |
          set -euo pipefail
          python3 client/apps/ios/scripts/verify_search_play.py \
            http://127.0.0.1:9978 'AppDrama2#2' '庆余年' \
            2>&1 | tee artifacts/search-play.log

      - name: Stop host
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/host.pid" ]; then kill "$(cat "$RUNNER_TEMP/host.pid")" 2>/dev/null || true; fi
          cp "$RUNNER_TEMP/host.log" artifacts/host.log 2>/dev/null || true
          cp "$RUNNER_TEMP/mock.log" artifacts/mock.log 2>/dev/null || true

      - name: Upload verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-verify-${{ github.run_number }}
          path: artifacts/**
          retention-days: 14
          if-no-files-found: warn
