# 可复用工作流：构建并推送 Docker 三镜像。
#
# 被 release.yml 调用（workflow_call），不单独触发。
# 单独重发镜像走 release.yml 的 workflow_dispatch（勾 docker），或直接调
# deploy/scripts/build-push-docker.ps1。
#
# ## 为什么独立成文件
#
# Docker 是最常单独重发的链路（改了后端/前端但版本号不变、或 Registry 某次推送失败）。
# 拆出来后它能被「只发镜像」的入口直接调用，不必连带跑 15 分钟的 PC 构建。

name: _docker

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      latest:
        description: 是否同时更新 latest 标签
        required: false
        type: boolean
        default: true
    secrets:
      DOCKERHUB_TOKEN:
        required: true

jobs:
  docker:
    name: Docker 三镜像
    runs-on: ubuntu-latest
    # 防止卡死烧满 6 小时默认上限（= 360 分钟额度）
    timeout-minutes: 30
    # ★ DOCKER_HUB_TOKEN 建在 Environment「dockerhub」下，不是仓库级。
    #   environment 级 secret 只有在 job 声明了同名 environment 时才可见；
    #   漏了会报 "Password required"（实测踩过）。
    environment: dockerhub
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          # 不用 env.*：login-action 的 with 里取 job-level env 不稳
          username: chrplus
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # web 镜像用宿主预构建 dist（--target runtime-dist）：比容器内 pnpm 快，
      # 且不受容器无 TTY 影响。dist 由 release.yml 的 web job 统一构建
      # （同一次 run 的 artifact），这里不再自己跑一遍 pnpm。
      - name: 取前端 dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: client/apps/web/dist

      # ★ Dockerfile.apiserver 有一句 `COPY server/build/dist/ ./build/dist/`，
      #   而**源目录不存在时 Docker 的 COPY 会直接 lstat 失败**（不是静默跳过）：
      #       ERROR: failed to build: lstat /server/build/dist: no such file or directory
      #
      #   2026-10-29 那次 `release-v0.9.37` 就挂在这里：三条链里只有 docker 红，
      #   publish 因为要求三条全 success 被整条跳过 → packages.json 从未更新 →
      #   客户端一直"检查更新说已是最新"。一个目录缺失能静默废掉整条发版链。
      #
      #   仓库里已常驻 `server/build/dist/.gitkeep`，但 git 的目录忽略规则很容易
      #   在某次改 .gitignore 时把它一起吞掉。这里再兜一层：目录不在就建出来，
      #   让构建不依赖"那个占位文件有没有被正确跟踪"。
      - name: 确保 server/build/dist 存在（Dockerfile COPY 的硬要求）
        shell: bash
        run: |
          mkdir -p server/build/dist
          if [ -z "$(ls -A server/build/dist)" ]; then
            echo "dist 为空：镜像只带占位文件（Android 侧需另行获取 dex jar）"
            touch server/build/dist/.gitkeep
          else
            echo "dist 内容："
            ls -la server/build/dist
          fi

      - name: 构建并推送
        shell: pwsh
        run: |
          # 用 hashtable splatting：数组里含逗号的 'linux/amd64,linux/arm64'
          # 会被 pwsh 拆成两个位置参数（实测踩过）
          $p = @{
            User        = 'chrplus'
            Version     = '${{ inputs.version }}'
            Platforms   = 'linux/amd64,linux/arm64'
            WebFromDist = $true
            Cache       = 'gha'
          }
          if ('${{ inputs.latest }}' -eq 'false') { $p.NoLatest = $true }
          ./deploy/scripts/build-push-docker.ps1 @p

      - name: 汇总镜像清单
        shell: bash
        run: |
          echo "### 镜像已推送" >> $GITHUB_STEP_SUMMARY
          for r in web apiserver drpy; do
            echo "- \`chrplus/meow-$r:${{ inputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          done
