name: release

# 公开壳发布：只构建不依赖源包的产物（Web/PC/TV/apiserver 插件）。
# 真实 config / spider jar / payload 不在公开库，也不进 Release。
on:
  push:
    tags:
      - 'release-v[0-9]*'
      - 'tv-v[0-9]*'
      - 'pc-v[0-9]*'
      - 'plugins-v[0-9]*'
      - 'tv-plugins-v[0-9]*'
      - 'docker-v[0-9]*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空读 client/package.json）'
        required: false
        type: string
      docker:
        description: '构建并推送 DockerHub 三镜像'
        required: false
        type: boolean
        default: true
      tv_plugins:
        description: '构建 TV 运行时模块（3 ABI）'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: 判定范围
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      tv: ${{ steps.scope.outputs.tv }}
      pc: ${{ steps.scope.outputs.pc }}
      plugins: ${{ steps.scope.outputs.plugins }}
      plugins_only: ${{ steps.scope.outputs.plugins_only }}
      docker: ${{ steps.scope.outputs.docker }}
      tvplugins: ${{ steps.scope.outputs.tvplugins }}
      release: ${{ steps.scope.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 读版本号
        id: v
        shell: bash
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then V=$(node -p "require('./client/package.json').version"); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "version=$V"
      - name: tag 与版本号一致
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${{ steps.v.outputs.version }}"
          # 版本域不同：壳/全量 tag 必须等于 package.json；
          # 模块与插件是独立版本线，tag 后缀不要求等于壳版本。
          case "$TAG" in
            tv-plugins-v[0-9]*) EXPECT="" ;;
            plugins-v[0-9]*)    EXPECT="" ;;
            *)                  EXPECT="${TAG##*-v}" ;;
          esac
          if [ -n "$EXPECT" ] && [ "$EXPECT" != "$VER" ]; then
            echo "::error::tag=$TAG 里的版本($EXPECT) 与 package.json 的 $VER 不一致"
            exit 1
          fi
      - name: 版本一致性
        shell: pwsh
        run: ./deploy/scripts/bump-version.ps1 -Check
      - name: 解析范围
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          set_out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            set_out tv true; set_out pc true; set_out plugins true; set_out release false
            set_out plugins_only ''
            set_out docker '${{ inputs.docker }}'; set_out tvplugins '${{ inputs.tv_plugins }}'
            exit 0
          fi
          TAG="${GITHUB_REF#refs/tags/}"
          case "$TAG" in
            release-v[0-9]*)    set_out tv true;  set_out pc true;  set_out plugins true;  set_out docker true;  set_out tvplugins false; set_out release true;  set_out plugins_only '' ;;
            tv-v[0-9]*)         set_out tv true;  set_out pc false; set_out plugins false; set_out docker false; set_out tvplugins false; set_out release true;  set_out plugins_only apiserver ;;
            pc-v[0-9]*)         set_out tv false; set_out pc true;  set_out plugins true;  set_out docker false; set_out tvplugins false; set_out release true;  set_out plugins_only apiserver ;;
            plugins-v[0-9]*)    set_out tv false; set_out pc false; set_out plugins true;  set_out docker false; set_out tvplugins false; set_out release true;  set_out plugins_only '' ;;
            tv-plugins-v[0-9]*) set_out tv false; set_out pc false; set_out plugins false; set_out docker false; set_out tvplugins true;  set_out release true;  set_out plugins_only '' ;;
            # ★ 只重建 Docker 三镜像（2026-11-12 补回）：不建 GitHub Release、不改 packages.json。
            docker-v[0-9]*)     set_out tv false; set_out pc false; set_out plugins false; set_out docker true;  set_out tvplugins false; set_out release false; set_out plugins_only '' ;;
            *) echo "::error::无法识别的 tag：$TAG"; exit 1 ;;
          esac

  web:
    name: Web dist
    needs: plan
    if: ${{ needs.plan.outputs.tv == 'true' || needs.plan.outputs.pc == 'true' || needs.plan.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - name: 构建 web
        working-directory: client
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @meow/web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: client/apps/web/dist
          if-no-files-found: error

      # ── fnOS fpk 用的那份 dist（2026-11-13）──────────────────────────
      # fpk 的 web 必须挂在 /app/meow/ 子路径下（base + VITE_API_BASE 都是编译期
      # 常量），和上面那份不是同一份产物，所以 fpk 以前在自己两条矩阵腿里各建
      # 一次 —— 全量里最后一段"三处重复"（见 _tv.yml:68 的同款注释）。
      # 现在在这里顺手多产一份，fpk 两腿直接下载复用。
      # ★ 只在全量 tag 上建：tv-v*/pc-v*/docker-v* 不需要它，不许多花这 40 秒。
      - name: 构建 web（fpk 版，/app/meow base，仅全量）
        if: ${{ startsWith(github.ref, 'refs/tags/release-v') }}
        working-directory: client
        run: |
          set -euo pipefail
          # typecheck 上面刚跑过（build = vue-tsc && vite build），这里只出产物
          VITE_API_BASE=/app/meow pnpm --filter @meow/web exec vite build \
            --base=/app/meow/ --outDir dist-fpk
          test -f apps/web/dist-fpk/index.html
          # 自检：base 必须真的落到 index.html 里，否则 fpk 端白屏
          grep -q '/app/meow/' apps/web/dist-fpk/index.html
      - uses: actions/upload-artifact@v4
        if: ${{ startsWith(github.ref, 'refs/tags/release-v') }}
        with:
          name: web-dist-fpk
          path: client/apps/web/dist-fpk
          if-no-files-found: error

  tv:
    name: TV APK
    needs: [plan, web]
    if: ${{ needs.plan.outputs.tv == 'true' }}
    uses: ./.github/workflows/_tv.yml
    with:
      version: ${{ needs.plan.outputs.version }}
    secrets: inherit

  pc:
    name: PC 壳
    needs: [plan, web]
    if: ${{ needs.plan.outputs.pc == 'true' }}
    uses: ./.github/workflows/_pc_shell.yml
    with:
      version: ${{ needs.plan.outputs.version }}

  docker:
    name: Docker 三镜像
    needs: [plan, web]
    if: ${{ needs.plan.outputs.docker == 'true' }}
    uses: ./.github/workflows/_docker.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      latest: true
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

  tv_plugins:
    name: TV 运行时模块
    needs: plan
    if: ${{ needs.plan.outputs.tvplugins == 'true' }}
    uses: ./.github/workflows/_tv_plugins.yml
    secrets: inherit

  plugins:
    name: 插件
    needs: plan
    if: ${{ needs.plan.outputs.plugins == 'true' }}
    uses: ./.github/workflows/_plugins.yml
    with:
      plugins_only: ${{ needs.plan.outputs.plugins_only }}

  # ── fnOS fpk（2026-11-13 补）────────────────────────────────────────────
  # 用户报：release-v* 全量发版**没有 fpk**，Release 缺资产、FnDepot 也没更新。
  # 现在全量链直接调 fpk.yml（workflow_call）：
  #   · 只构建，产物由下面的 publish 收进主 Release（和 TV/PC 同页）
  #   · 索引等 Publish 之后由 fpk.yml 的 index-after-publish 写
  #     （FnDepot 正式源 + fpk-updates 镜像），与 sync-packages 同一时机
  #   · 仍保留 fpk-v* 单链 —— 只补 fpk 时不用重跑 Docker/TV/PC
  # 只在全量 tag 上跑：tv-v/pc-v/plugins-v 这些单链不带 fpk。
  fpk:
    name: fnOS fpk
    # ★ 必须等 web（2026-11-13 实测）：fpk 两腿要复用 web 的 /app/meow 版 dist。
    #   原来只 needs: plan → 腿在 +20s 起跑，而 web 到 +54s 才上传 artifact，
    #   下载步骤必然扑空并静默回落自建（日志「没有可复用的 dist → 自行构建」），
    #   等于两条腿各多跑一遍 pnpm install + typecheck + vite。
    needs: [plan, web]
    if: ${{ github.event_name == 'push' && needs.plan.outputs.release == 'true'
            && startsWith(github.ref, 'refs/tags/release-v') }}
    permissions:
      contents: write
    uses: ./.github/workflows/fpk.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      mirror_tag: fpk-v${{ needs.plan.outputs.version }}
    secrets:
      FNDEPOT_TOKEN: ${{ secrets.FNDEPOT_TOKEN }}

  publish:
    name: 建 draft Release
    # ★ fpk 也进 needs（2026-11-13 用户口径）：全量 Release 必须自带 fnOS 包，
    #   不另出 fpk-v* Release —— 用户下载/归档只认一个 Release，
    #   和 TV/PC 的包同级。副作用：fpk 失败 = 这轮不建 Release（和 web/tv/pc 同语义）。
    needs: [plan, web, tv, pc, plugins, docker, tv_plugins, fpk]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.plan.outputs.release == 'true'
            && needs.web.result != 'failure' && needs.web.result != 'cancelled'
            && needs.tv.result != 'failure' && needs.tv.result != 'cancelled'
            && needs.pc.result != 'failure' && needs.pc.result != 'cancelled'
            && needs.plugins.result != 'failure' && needs.plugins.result != 'cancelled'
            && needs.docker.result != 'failure' && needs.docker.result != 'cancelled'
            && needs.tv_plugins.result != 'failure' && needs.tv_plugins.result != 'cancelled'
            && needs.fpk.result != 'failure' && needs.fpk.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: 整理目录
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          # ★ 含 .fpk：全量时 fpk job 的 artifact（fpk-x86 / fpk-arm）也在这个 run 里，
          #   fnOS 包跟 TV/PC 的包同级放主 Release（2026-11-13 用户口径）。
          #   单链 tv-v*/pc-v* 等没有 fpk artifact，find 不会命中，行为不变。
          find dist -type f \( -name '*.apk' -o -name '*.exe' -o -name '*.zip' -o -name '*.fpk' \) -exec cp {} upload/ \; || true
          ls -la upload
          # 公开壳发布守卫：绝不允许源包混进 Release
          if find upload -type f \( -name 'spider*.jar' -o -name 'config.sites.json' -o -name 'node-payload-danmu.zip' \) | grep -q .; then
            echo "::error::公开 Release 里出现源包文件"; exit 1
          fi
      - name: 生成 SHA256
        shell: bash
        working-directory: upload
        run: |
          set -euo pipefail
          [ "$(ls | wc -l)" -gt 0 ] && sha256sum * > SHA256SUMS.txt
      # ★ 更新说明进 Release 正文（2026-11-12 用户指出 1.2.0 页面上没有说明）。
      #   以前正文是纯静态资产表，用户只在应用内弹框里才看得到 CHANGELOG。
      #   解析口径与 fpk.yml 的「取更新说明」完全一致（`## <版本>` 小节）。
      - name: 取更新说明
        id: notes
        shell: bash
        env:
          VER: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="$(awk -v v="$VER" '
            /^##[[:blank:]]/ {
              h = $0
              sub(/^##[[:blank:]]+/, "", h)
              sub(/[[:blank:]]+$/, "", h)
              if (h == v || h == "[" v "]") { hit = 1; next }
              if (hit) exit
            }
            hit {
              t = $0
              gsub(/^[[:blank:]]+|[[:blank:]]+$/, "", t)
              if (t == "") next
              print t
            }
          ' CHANGELOG.md)"
          {
            echo "notes<<MEOW_EOF"
            echo "$NOTES"
            echo "MEOW_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: 建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: false
          files: upload/*
          body: |
            ## 更新说明

            ${{ steps.notes.outputs.notes }}

            ## 公开壳产物

            本 Release 只含空壳，不含 spider jar / 真实站点配置 / payload。
            安装后请在应用内导入自己的源包。

            | 文件 | 说明 |
            |---|---|
            | `meow-TV-*.apk` | TV 空壳 |
            | `tv-node-*.apk` | TV 运行时模块 |
            | `meow-setup-*.exe` / `meow-bare-*.exe` | PC 空壳 |
            | `apiserver-*.zip` | PC 后端插件 |
            | `drpy-*.zip` / `danmu-api-*.zip` / `node-*.zip` / `ffmpeg-*.zip` | PC 插件 |
            | `meow_*.fpk` | fnOS 套件（x86 / arm） |
            | `packages.json` | 客户端更新清单 |
            | `SHA256SUMS.txt` | 校验 |

  sync-packages:
    name: 生成 packages.json
    if: ${{ github.event_name == 'release' && github.event.action == 'published' && !startsWith(github.event.release.tag_name, 'fpk-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: 生成并上传清单
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./deploy/scripts/sync-packages.ps1 -Tag $env:GITHUB_REF_NAME
