# 源包静态服务（只读）。
#
# 与 Dockerfile.web 的区别：
#   - 这里没有 SPA，不能把找不到的路径回落到 index.html；
#   - 找不到文件必须返回 404，否则客户端会把首页 HTML 当 JSON/jar 解析；
#   - .jar 显式声明 application/java-archive，部分客户端按 MIME 判断。
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    autoindex off;
    charset utf-8;

    # 源包是发布产物，更新后应立刻可见；no-cache 让客户端每次回源校验。
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;

    location / {
        # ★ 不能写 try_files $uri $uri/ /index.html：源包服务没有首页，
        #   回落 HTML 会让客户端拿到 200 但解析失败（比 404 更难查）。
        try_files $uri =404;
    }

    # nginx 默认 mime.types 不一定包含 jar；显式声明，避免被当成 octet-stream。
    location ~* \.jar$ {
        default_type application/java-archive;
        try_files $uri =404;
    }
}
