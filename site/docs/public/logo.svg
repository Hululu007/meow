<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    猫窝 Meow —— 猫头 = 播放键

    设计约束（对齐 ZCode / Edge / 微信这类系统级图标）：
    · 纯平色底，不用渐变——渐变在小尺寸会糊，也削弱与白色的对比锐度
    · 尖耳剪影：耳尖是明确的锐角折点，不是圆弧（猫的辨识度主要靠耳形）
    · 播放三角镂空，尺寸够大，16px 下仍可辨
    · 包围盒上下左右留白相等（上下 100 / 左右 82），精确居中
  -->
  <defs>
    <clipPath id="tile">
      <rect width="512" height="512" rx="112" ry="112" />
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#0FA9A0" />

    <path fill="#FFFFFF" d="
      M 140 120
      Q 144 94 166 102
      L 232 154
      Q 256 144 280 154
      L 346 102
      Q 368 94 372 120
      L 390 212
      Q 428 244 430 294
      Q 434 390 342 406
      Q 256 418 170 406
      Q 78 390 82 294
      Q 84 244 122 212
      Z" />

    <path fill="#0FA9A0" d="M 228 210 L 228 328 L 338 269 Z" />
  </g>
</svg>
